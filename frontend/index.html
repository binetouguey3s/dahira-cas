<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo.jpg" />
    <meta name="theme-color" content="#0B3D2E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plateforme officielle du Dahira Cheikh Abdoulahi Seye — enseignements du Guide, médiathèque, vie du Dahira et espace membres." />
    <title>Dahira Cheikh Abdoulahi Seye</title>
    <style>
      /* Écran d'accueil : affiché tout de suite (avant le chargement du site), retiré par main.tsx. */
      #ecran-accueil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(120% 90% at 50% 40%, #ffffff 0%, #fbf8ef 55%, #f1ead6 100%);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        /* Sécurité : si le site ne se charge pas, l'écran s'efface quand même. */
        animation: accueil-secours 0.5s ease 8s forwards;
      }
      #ecran-accueil.sortie {
        animation: accueil-sortie 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .accueil-halo {
        position: absolute;
        width: min(150vw, 900px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(30, 122, 93, 0.16) 0%, rgba(217, 200, 154, 0.12) 35%, transparent 65%);
        animation: accueil-halo 2.4s ease-out both;
      }
      .accueil-medaillon {
        position: relative;
        width: min(68vw, 280px);
        aspect-ratio: 1;
        /* Entrée avec rebond, puis le logo « respire » doucement jusqu'à l'ouverture du site. */
        animation:
          accueil-logo 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both,
          accueil-respire 2.6s ease-in-out 1.2s infinite;
      }
      .accueil-medaillon img {
        position: absolute;
        inset: 9%;
        width: 82%;
        height: 82%;
        object-fit: contain;
        border-radius: 18%;
      }
      .accueil-cadre {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .accueil-cadre rect {
        fill: #ffffff;
        stroke: url(#accueil-or);
        stroke-width: 2.2;
        /* Un peu plus que la longueur du tracé : le cadre se referme sans coupure. */
        stroke-dasharray: 1.02 1;
        stroke-dashoffset: 1.02;
        filter: drop-shadow(0 24px 40px rgba(11, 61, 46, 0.18));
        animation: accueil-trace 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards;
      }
      .accueil-reflet {
        position: absolute;
        inset: 9%;
        border-radius: 18%;
        overflow: hidden;
        pointer-events: none;
      }
      .accueil-reflet::after {
        content: "";
        position: absolute;
        top: -20%;
        bottom: -20%;
        width: 35%;
        left: -60%;
        background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.85) 50%, transparent 100%);
        transform: skewX(-12deg);
        /* Reflet de lumière : une première fois, puis une seconde avant l'ouverture. */
        animation:
          accueil-reflet 0.9s ease-in-out 1.15s both,
          accueil-reflet 0.9s ease-in-out 3.3s both;
      }
      .accueil-salut {
        position: relative;
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8a6d2a;
        animation: accueil-texte 0.7s ease-out 1.05s both;
      }
      .accueil-points {
        position: relative;
        display: flex;
        gap: 7px;
        animation: accueil-texte 0.5s ease-out 1.3s both;
      }
      .accueil-points span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1e7a5d;
        animation: accueil-point 1s ease-in-out infinite;
      }
      .accueil-points span:nth-child(2) { animation-delay: 0.15s; }
      .accueil-points span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes accueil-logo {
        from { opacity: 0; transform: scale(0.55); filter: blur(14px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
      }
      @keyframes accueil-trace { to { stroke-dashoffset: 0; } }
      @keyframes accueil-respire {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      @keyframes accueil-reflet { from { left: -60%; } to { left: 130%; } }
      @keyframes accueil-texte {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes accueil-halo {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes accueil-point {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes accueil-sortie {
        to { opacity: 0; transform: scale(1.06); visibility: hidden; }
      }
      @keyframes accueil-secours { to { opacity: 0; visibility: hidden; } }

      /* Animations réduites (réglage du téléphone) : simple fondu, sans mouvement. */
      @media (prefers-reduced-motion: reduce) {
        .accueil-halo, .accueil-medaillon, .accueil-salut, .accueil-points, .accueil-reflet::after,
        .accueil-points span { animation: none !important; }
        .accueil-cadre rect { animation: none; stroke-dashoffset: 0; }
        #ecran-accueil.sortie { animation: accueil-secours 0.3s ease forwards; }
      }
    </style>
  </head>
  <body>
    <div id="ecran-accueil" aria-hidden="true">
      <div class="accueil-halo"></div>
      <div class="accueil-medaillon">
        <svg class="accueil-cadre" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="accueil-or" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#BFA05A" />
              <stop offset="0.5" stop-color="#F3E7C4" />
              <stop offset="1" stop-color="#BFA05A" />
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="97" height="97" rx="22" pathLength="1" />
        </svg>
        <img src="/logo.jpg" alt="" width="600" height="600" />
        <div class="accueil-reflet"></div>
      </div>
      <p class="accueil-salut">Dalal ak Diam !</p>
      <div class="accueil-points"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
